format = """
$directory\
$git_branch$git_commit$git_state$git_metrics$git_status$python\
$jobs\
$line_break\
$character\
"""

add_newline = true

[os]
format = "[$symbol]($style)[]()"
style = "fg:gray"
disabled = false

[os.symbols]
Macos = ""
Arch = "󰣇"
Debian = ""

[character]
success_symbol = '[](bold cyan)'
error_symbol = '[](bold red)'

[directory]
format = ' [$path]($style)[ ]()'
style = 'fg:242 bold'
home_symbol = '~'
read_only = 'ro '
read_only_style = 'fg:yellow'
truncation_length = 4
truncation_symbol = '../'
truncate_to_repo = false
use_os_path_sep = true
disabled = false

[git_branch]
format = '[  $branch(:$remote_branch)]($style)[ ]()'
style = 'fg:cyan'
symbol = ''

[git_commit]
format = '[\($hash$tag\)]($style)[ ]()'
style = 'fg:yellow'
commit_hash_length = 8
tag_symbol = 't '
disabled = false

[git_metrics]
format = '[\[+$added/]($added_style)[-$deleted\]]($deleted_style)[ ]()'
added_style = 'fg:green'
deleted_style = 'fg:red'
disabled = false

[git_status]
format = '([$all_status$ahead_behind]($style))'
style = 'fg:orange'
conflicted = '[=${count} ](fg:red)'
ahead = '[⇡${count} ](fg:yellow)'
behind = '[⇣${count} ](fg:yellow)'
diverged = '[⇕${ahead_count}⇡${behind_count}⇣ ](fg:yellow)'
untracked = '[?${count} ](fg:red)'
stashed = '[*${count} ](fg:blue)'
modified = '[!${count} ](fg:yellow)'
staged = '[+${count} ](fg:green)'
renamed = '[>${count} ](fg:orange)'
deleted = '[-${count} ](fg:red)'
disabled = false

[jobs]
format = '[  ](fg:cyan bold)[$symbol$number]($style)'
style = 'fg:cyan'
symbol = ''
symbol_threshold = 1
number_threshold = 1
disabled = false

[python]
format = '[(\($virtualenv\) )]($style)'

