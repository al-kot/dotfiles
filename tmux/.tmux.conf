if-shell '[ -n "$SSH_CLIENT" ]' {
    set -g prefix C-a
    bind-key C-a send-prefix
} {
    set -g prefix C-b
    bind-key C-b send-prefix
}

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
unbind r
bind r source-file ~/.tmux.conf

set-option -g default-shell '/bin/zsh'
# set-option -g default-terminal "tmux-256color"
set-option -g default-terminal "xterm-256color"
# set -g default-terminal "${TERM}"
# set-option -sa terminal-overrides ',xterm-kitty:Tc'
set-window-option -g xterm-keys on
set -g extended-keys on
set -g extended-keys-format csi-u

set -g mouse on

set -g mode-keys vi
set -g status-keys emacs

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

set -gq allow-passthrough on
set-option -g focus-events on
set -g visual-activity off


unbind z
bind m resize-pane -Z

bind s display-popup -E -h 80% -w 80% "\
    tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
    grep -v clanker |\
    sed '/^$/d' |\
    fzf --reverse --preview 'tmux capture-pane -ep -t {}' --preview-window=noborder,right,90% --border=none --no-height  |\
    xargs tmux switch-client -t"
bind k display-popup -E -h 30% -w 10% "\
    tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
    sed -r '/^\s*$/d' |\
    fzf --reverse -m --border=none --no-height |\
    xargs -I {} tmux kill-session -t {}"
bind h display-popup -E -h 80% -w 80% \
    "~/.tmux/ssh-launcher.sh && tmux switch -t ssh"

bind-key -n C-n display-popup -E -h 80% -w 80% \
    "TMUX_PANE=0 nvim ~/.scratch/$(date '+%m-%dT%H:%M:%S') -c ':nnoremap <C-n> :%y<CR>:wq<CR> | noremap <S-q> :q!<CR>'"

bind-key -n C-g if-shell "tmux display-message -p '#S' | grep clankers" {
    detach-client
} {
    run-shell '\
        SESSION="clankers-#S"; \
        tmux has-session -t "$SESSION" 2>/dev/null || (\
                tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" && \
                tmux send-keys -t "$SESSION".0 "nvm use 22 && pi" ENTER ) ; \
        tmux display-popup -w90% -h90% -E "tmux attach-session -t $SESSION"'
}

bind S command-prompt -p "New Session:" "new-session -A -s '%%' -c $HOME"

unbind -T copy-mode-vi MouseDragEnd1Pane

set -sg escape-time 0

set -g @plugin 'tmux-plugins/tpm'

bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h'  'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j'  'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k'  'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l'  'select-pane -R'

bind-key -n C-S-h if -F "#{@pane-is-vim}" 'send-keys C-S-h' 'resize-pane -L 3'
bind-key -n C-S-j if -F "#{@pane-is-vim}" 'send-keys C-S-j' 'resize-pane -D 3'
bind-key -n C-S-k if -F "#{@pane-is-vim}" 'send-keys C-S-k' 'resize-pane -U 3'
bind-key -n C-S-l if -F "#{@pane-is-vim}" 'send-keys C-S-l' 'resize-pane -R 3'

bind-key -n C-Down select-window -t:+
bind-key -n C-Up select-window -t:-
bind-key -n "F10" select-window -t:0
bind-key -n "F1" select-window -t:1
bind-key -n "F2" select-window -t:2
bind-key -n "F3" select-window -t:3
bind-key -n "F4" select-window -t:4
bind-key -n "F5" select-window -t:5
bind-key -n "F6" select-window -t:6
bind-key -n "F7" select-window -t:7
bind-key -n "F8" select-window -t:8
bind-key -n "F9" select-window -t:9

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-dir '~/.tmux/resurrect'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'off'
set -g @continuum-boot 'off'

set -g @fg "#625e5a"
set -g @bg "#1d1c19"
set -g @accent "#87a987"

set -g status-position "bottom"
set -g status-style bg=default,fg="#{@fg}"
set -g status-justify "left"
set -g status-interval 2

set -g status-right '#(c=$(tmux list-windows -t "clankers-#{session_name}" 2>/dev/null | grep -c .); \
[ $c -ne 0 ] && echo "$c clanker(s) ") \
#[bg=default]#{?client_prefix,, #S }#[bg=#{@accent},fg=#{@bg}]#{?client_prefix, #S ,}'

set -g status-left ""
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#{@accent},fg=#{@bg}] #I:#W#{?window_zoomed_flag, 󰊓 , }"

set -g pane-active-border-style bg=default,fg="#{@accent}"
set -g pane-border-style bg=default,fg="#32302f"
set -g pane-border-indicators arrows

run '~/.tmux/plugins/tpm/tpm'
unbind -n Tab
