include kanagawa.conf
# term xterm-kitty
font_family Mononoki Nerd Font Mono
font_size 14.0
cursor_shape beam
sync_to_monitor yes
detect_urls yes
enable_audio_bell no
window_padding_width 8 12 5 12
background_opacity 0.9
shell_integration no-cursor

macos_option_as_alt yes
macos_quit_when_last_window_closed yes
macos_show_window_title_in none
hide_window_decorations titlebar-only
background_blur 15
clear_all_shortcuts yes

map super+v paste_from_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0

map ctrl+1 send_text all \x1b[11~
map ctrl+2 send_text all \x1b[12~
map ctrl+3 send_text all \x1b[13~
map ctrl+4 send_text all \x1b[14~
map ctrl+5 send_text all \x1b[15~
map ctrl+6 send_text all \x1b[17~
map ctrl+7 send_text all \x1b[18~
map ctrl+8 send_text all \x1b[19~
map ctrl+9 send_text all \x1b[20~
map ctrl+0 send_text all \x1b[21~

