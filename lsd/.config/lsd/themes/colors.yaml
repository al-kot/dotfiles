# lackluster-inspired lsd theme
# Mostly shades of gray with very rare muted accents
#
# 236 = near black   (#080808 ~ lack bg)
# 238 = med-dark gray (#444444 ~ lack gray)
# 240 = dark gray    (between lack grays)
# 242 = slate        (#708090 ~ lack cyan)
# 243 = medium gray  (#7A7A7A ~ luster gray)
# 245 = light-mid gray (between luster gray and fg)
# 255 = foreground   (#DEEEED ~ luster fg)
# 108 = muted green  (#789978 ~ primary accent)
# 103 = muted blue   (#7788AA ~ rare accent)
# 180 = muted orange (#dfAA88 ~ rare accent)
# 95  = dark red     (#663333 ~ warning accent)

user: 243
group: 242
permission:
  read: 243
  write: 243
  exec: 108
  exec-sticky: 255
  no-access: 95
  octal: 243
  acl: 242
  context: 242
date:
  hour-old: 108
  day-old: 243
  older: 240
size:
  none: 240
  small: 243
  medium: 245
  large: 95
inode:
  valid: 242
  invalid: 95
links:
  valid: 242
  invalid: 95
tree-edge: 236